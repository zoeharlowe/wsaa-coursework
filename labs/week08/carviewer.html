<!DOCTYPE html>
<html>
<head>
    <title>Book Viewer</title>
    <script src="books.js"></script>
</head>
<body>

<button id="button-showCreate" onclick="showCreate()">Create Book</button>

<table id="bookTable" border="1">
    <tr>
        <th>ID</th><th>Title</th><th>Author</th><th>Actions</th>
    </tr>
</table>

<!-- Hidden form -->
<div id="createUpdateForm" style="display:none">
    <span id="createLabel">Create</span>
    <span id="updateLabel" style="display:none">Update</span> Book

    <br><br>

    ID: <input name="id"><br>
    Title: <input name="title"><br>
    Author: <input name="author"><br><br>

    <button id="button-doCreate" onclick="doCreate()">Create</button>
    <button id="button-doUpdate" onclick="doUpdate()" style="display:none">Update</button>
</div>

</body>
</html>
